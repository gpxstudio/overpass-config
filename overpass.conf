map $http_origin $cors_origin {
    default "";
    ~^https?://(localhost:4283|gpx\.studio)$         $http_origin;
    ~^(tauri://localhost|https?://tauri\.localhost)$ $http_origin;
}

server {
    listen 80 default_server;
    server_name _;

    access_log /var/log/nginx/overpass_access.log;
    error_log  /var/log/nginx/overpass_error.log warn;

    location /api/interpreter {
        add_header 'Access-Control-Allow-Origin'  $cors_origin always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type' always;
        add_header 'Vary' 'Origin' always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        proxy_pass http://localhost:8989;
        proxy_hide_header 'Access-Control-Allow-Origin';
        proxy_set_header Host $http_host;
    }
}